[project]
name = "form-killer"
version = "0.1.0"
description = "A CLI-first LLM assistant for answering and submitting web forms through provider plugins."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chafa-py>=1.2.0",
    "httpx>=0.27.0",
    "openai>=1.99.0",
    "pillow>=10.0.0",
    "playwright>=1.48.0",
    "pydantic>=2.7.0",
    "pytest>=8.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
form-killer = "form_killer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/form_killer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
